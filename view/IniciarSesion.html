<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Donapp</title>
    <link rel="icon" type="image/png" href="../assets/uploads/Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/StylesIniciarS.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="caja-exterior">
        <a href="../index.php" class="logo-container">
            <img src="../assets/uploads/Red Logo.png" alt="Logo Donapp" class="form-logo">
        </a>

        <h2>¡Bienvenido de nuevo!</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>
        
        <form action="../controller/inicio_sesion.php" method="POST" class="form-container">
            <div class="input-group">
                <label for="usuario"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                <input type="email" name="email" id="usuario" 
                       placeholder="Ingresa tu correo registrado" 
                       required maxlength="150">
            </div>
            
            <div class="input-group">
                <label for="contrasena"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" name="contrasena" id="contrasena" 
                           placeholder="Ingresa tu contraseña" 
                           required maxlength="30">
                    <button type="button" id="togglePassword" class="eye-btn">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <a href="../controller/recuperar_password.php" class="forgot-pass">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="boton-moderno">
                <span>Ingresar</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <div class="auth-links">
                <p>¿No tienes cuenta? <a href="Registrar.html">Regístrate aquí</a></p>
            </div>
        </form>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
